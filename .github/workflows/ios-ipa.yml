name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned device application
        working-directory: ios
        run: |
          xcodebuild \
            -project WatchApp.xcodeproj \
            -scheme WatchApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p artifact/Payload
          cp -R build/Build/Products/Release-iphoneos/WatchApp.app artifact/Payload/
          cd artifact
          /usr/bin/ditto -c -k --keepParent Payload WatchApp-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WatchApp-unsigned-ipa
          path: ios/artifact/WatchApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
